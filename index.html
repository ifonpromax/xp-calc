<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор медали CS2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1419);
    --fg: var(--tg-theme-text-color, #e8eaed);
    --hint: var(--tg-theme-hint-color, #8b949e);
    --card: var(--tg-theme-secondary-bg-color, #1a2027);
    --line: rgba(128, 128, 128, .22);
    --accent: #3b82f6;
    --green: #34a853;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 18px 16px 40px; background: var(--bg); color: var(--fg);
         font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; }

  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .logo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none;
          background: linear-gradient(135deg, rgba(59,130,246,.28), rgba(52,168,83,.22)); border: 1px solid var(--line); }
  h1 { font-size: 21px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .sub { font-size: 13px; color: var(--hint); margin-top: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px;
          position: relative; animation: rise .35s ease both; }
  .card.top { z-index: 10; }
  .h2 { font-size: 12px; color: var(--hint); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; font-weight: 600; }

  label { display: block; font-size: 13px; color: var(--hint); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=number] { width: 100%; padding: 12px 14px; font-size: 17px; font-weight: 600; color: var(--fg);
         background: var(--bg); border: 1px solid var(--line); border-radius: 12px; outline: none;
         transition: border-color .15s, box-shadow .15s; -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.25); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }

  .dd { position: relative; }
  .ddbtn, .dditem { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; font-size: 16px; font-weight: 600;
         color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; text-align: left; cursor: pointer;
         font-family: inherit; transition: border-color .15s, background .15s; }
  .ddbtn:active, .ddbtn:focus-visible { border-color: var(--accent); }
  .ddbtn::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--hint); border-bottom: 2px solid var(--hint);
         transform: rotate(45deg) translateY(-2px); transition: transform .2s; }
  .ddbtn.open::after { transform: rotate(-135deg) translateY(-2px); }
  .ddlist { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); background: var(--card);
         border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 14px 34px rgba(0,0,0,.45); }
  .ddlist:not([hidden]) { animation: pop .16s ease both; }
  .dditem { border: 0; border-radius: 0; border-top: 1px solid var(--line); background: transparent; }
  .dditem:first-child { border-top: 0; }
  .dditem:active { background: rgba(128,128,128,.14); }
  .dditem.sel { background: rgba(59,130,246,.12); }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tile .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .tile .k { font-size: 12px; color: var(--hint); margin-top: 2px; }

  .prog { margin-top: 14px; }
  .prog .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--hint); margin-bottom: 7px; }
  .prog .top b { color: var(--fg); }
  .bar { height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .5s ease;
             background: linear-gradient(90deg, var(--accent), var(--green)); }

  .item { display: flex; align-items: center; gap: 14px; padding: 12px 0; position: relative; }
  .item + .item::before { content: ""; position: absolute; left: 23px; top: -12px; height: 24px; width: 2px; background: var(--line); }
  .ico { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--bg); border: 2px solid; }
  .item .mid { flex: 1; min-width: 0; }
  .item .nm { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item .dt { font-size: 14px; color: var(--hint); margin-top: 1px; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: rgba(59,130,246,.18); color: #8db8ff; }
  .pill { flex: none; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 99px; background: rgba(128,128,128,.16); }
  .empty { color: var(--hint); font-size: 15px; padding: 4px 0; }
  .total { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--hint); }
  .total b { color: var(--fg); }
  .hint { font-size: 12px; color: var(--hint); margin: 6px 2px 0; }
  .note { font-size: 12px; color: var(--hint); line-height: 1.5; padding: 0 4px; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo" id="logo"></div>
    <div>
      <h1>Калькулятор медали</h1>
      <div class="sub" id="year"></div>
    </div>
  </div>

  <div class="card top">
    <label for="g">XP за игру</label>
    <input id="g" type="number" inputmode="decimal" step="any" min="1">
    <div class="hint">сколько XP за игру ты получаешь после штрафа (молния XP Overload на нике)</div>

    <div class="row">
      <div><label for="r">Ранг сейчас</label><input id="r" type="number" inputmode="numeric" min="1" max="40"></div>
      <div><label for="x">XP</label><input id="x" type="number" inputmode="numeric" min="0" max="4999"></div>
    </div>

    <label>Уровень медали</label>
    <div class="dd">
      <button type="button" class="ddbtn" id="ddBtn"></button>
      <div class="ddlist" id="ddList" hidden></div>
    </div>
  </div>

  <div class="card" id="summary"></div>
  <div class="card" id="levels"></div>
  <p class="note" id="note"></p>
</div>

<script>
// Калькулятор сервисной медали CS2. Один и тот же код работает и в боте, и в мини-приложении.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.XpCalc = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const XP_PER_RANK = 5000;
  const TO_RANK_40 = 39 * XP_PER_RANK; // с 1-го до 40-го ранга: 195 000 XP
  const MIN = 60000;
  const DAY = 86400000;
  const MAX_MEDAL_LEVEL = 6;

  // Последний недельный сброс (по умолчанию среда, 00:00 UTC). Точное время у Valve может чуть отличаться.
  function lastReset(nowMs, resetDow, resetHour) {
    const dow = resetDow === undefined ? 3 : resetDow;
    const hour = resetHour === undefined ? 0 : resetHour;
    const d = new Date(nowMs);
    const back = (d.getUTCDay() - dow + 7) % 7;
    const t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), hour) - back * DAY;
    return t > nowMs ? t - 7 * DAY : t;
  }

  // Недельный множитель (по данным сообщества, у Valve точных чисел нет):
  // за неделю набрано < 4500 XP: x4 (бонус), 4500-7500: x2, 7500-11167: x1 (бонус кончился),
  // от 11167: x0,175 (XP Overload, штраф). Сброс в среду.
  const OVERLOAD_FROM = 11167;
  const OVERLOAD_MULT = 0.175;
  function bonusMultiplier(weekXp) {
    if (weekXp < 4500) return 4;
    if (weekXp < 7500) return 2;
    if (weekXp < OVERLOAD_FROM) return 1;
    return OVERLOAD_MULT;
  }

  // Сколько XP в среднем набирается за обычную неделю, начиная с понедельного сброса
  function typicalWeekXp(xpPerGame, step, weeklyBonus) {
    let weekXp = 0;
    let xp = 0;
    for (let t = 0; t < 7 * DAY; t += step) {
      const gain = xpPerGame * (weeklyBonus ? bonusMultiplier(weekXp) : 1);
      weekXp += gain;
      xp += gain;
    }
    return xp;
  }

  // o: now, endMs, rank, xpInRank, medalLevel, xpPerGame, minPerGame, hoursPerDay,
  //    weeklyBonus, weekXp, resetDow, resetHour
  function simulate(o) {
    const hoursPerDay = Math.min(24, Math.max(0.5, o.hoursPerDay || 24));
    const step = ((o.minPerGame * 24) / hoursPerDay) * MIN; // средний шаг между играми с учётом перерывов
    const resetDow = o.resetDow === undefined ? 3 : o.resetDow;
    const resetHour = o.resetHour === undefined ? 0 : o.resetHour;
    let nextReset = lastReset(o.now, resetDow, resetHour) + 7 * DAY;
    let weekXp = o.weekXp || 0;
    let toGo = Math.max(0, (40 - o.rank) * XP_PER_RANK - (o.rank >= 40 ? 0 : o.xpInRank));
    let level = o.medalLevel || 0;
    let t = o.now;
    let games = 0;
    let xp = 0;
    const results = [];

    if (!(o.xpPerGame > 0) || !(o.minPerGame > 0)) return { results, games, xp, error: 'bad input' };

    if (toGo <= 0 && level < MAX_MEDAL_LEVEL) {
      level += 1;
      results.push({ level, at: t, games, xp });
      toGo = TO_RANK_40;
    }
    while (level < MAX_MEDAL_LEVEL) {
      t += step;
      if (t > o.endMs) break;
      while (t >= nextReset) { weekXp = 0; nextReset += 7 * DAY; }
      const gain = o.xpPerGame * (o.weeklyBonus ? bonusMultiplier(weekXp) : 1);
      weekXp += gain;
      toGo -= gain;
      xp += gain;
      games += 1;
      if (toGo <= 0) {
        level += 1;
        results.push({ level, at: t, games, xp });
        toGo = TO_RANK_40; // XP сверх 40-го ранга при сбросе сгорает
      }
    }
    const gamesPerDay = (hoursPerDay * 60) / (o.minPerGame);
    const xpPerDay = typicalWeekXp(o.xpPerGame, step, o.weeklyBonus) / 7;
    return { results, games, xp, xpPerDay, gamesPerDay, levelsByEnd: level - (o.medalLevel || 0) };
  }

  return { simulate, lastReset, bonusMultiplier, OVERLOAD_FROM, OVERLOAD_MULT, XP_PER_RANK, TO_RANK_40, DAY, MIN };
});

</script>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var q = new URLSearchParams(location.search);
  function param(name, fallback) {
    var v = parseFloat(q.get(name));
    return isFinite(v) ? v : fallback;
  }
  function el(id) { return document.getElementById(id); }

  // Скрытые настройки: минуты между играми и XP за неделю бот передаёт сам, иначе берутся обычные значения
  var MIN_PER_GAME = param('m', 10.8);
  var WEEK_XP = param('w', 0);
  var HOURS_PER_DAY = 24;

  var MEDALS = [
    { lvl: 0, name: 'Нет медали', color: null },
    { lvl: 1, name: 'Серая', color: '#c3c7cc' },
    { lvl: 2, name: 'Зелёная', color: '#34a853' },
    { lvl: 3, name: 'Синяя', color: '#4285f4' },
    { lvl: 4, name: 'Фиолетовая', color: '#a142f4' },
    { lvl: 5, name: 'Розовая', color: '#ec4899' },
    { lvl: 6, name: 'Красная', color: '#ea4335' }
  ];
  var medalLevel = Math.min(6, Math.max(0, Math.round(param('lv', 0))));

  // Картинки медалей: SteamDB хранит их по номеру предмета. 2026 год: 5270 (уровень 1) ... 5275 (уровень 6).
  // Если картинка не загрузилась, показывается нарисованная иконка.
  var MEDAL_BASE = { 2026: 5270 };
  function svgIcon(color, size) {
    if (!color) {
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24"><circle cx="12" cy="14" r="7" fill="none" ' +
             'stroke="#8b949e" stroke-width="1.6" stroke-dasharray="3 3"/></svg>';
    }
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24">' +
      '<path d="M6.5 1.5h4l3 8h-4z" fill="' + color + '" opacity=".6"/>' +
      '<path d="M17.5 1.5h-4l-3 8h4z" fill="' + color + '" opacity=".85"/>' +
      '<circle cx="12" cy="15" r="7.5" fill="' + color + '"/>' +
      '<circle cx="12" cy="15" r="4.6" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/></svg>';
  }
  window.__fb = function (img, color, size) { img.outerHTML = svgIcon(color, size); };
  function icon(color, size, lvl) {
    size = size || 24;
    var year = new Date().getUTCFullYear();
    if (color && lvl >= 1 && MEDAL_BASE[year]) {
      var url = 'https://www.steamdb.com/assets/images/skins/cs2/collectibles/' + year + '-service-medal--' + (MEDAL_BASE[year] + lvl - 1) + '.png';
      return '<img src="' + url + '" width="' + size + '" height="' + size + '" alt="" style="object-fit:contain" ' +
             'onerror="__fb(this,\'' + color + '\',' + size + ')">';
    }
    return svgIcon(color, size);
  }

  function renderDropdown() {
    var m = MEDALS[medalLevel];
    el('ddBtn').innerHTML = icon(m.color, 30, m.lvl) + '<span>' + m.name + '</span>';
    var html = '';
    MEDALS.forEach(function (x) {
      html += '<button type="button" class="dditem' + (x.lvl === medalLevel ? ' sel' : '') + '" data-lvl="' + x.lvl + '">' +
              icon(x.color, 30, x.lvl) + '<span>' + x.name + '</span></button>';
    });
    el('ddList').innerHTML = html;
  }
  function setOpen(open) {
    el('ddList').hidden = !open;
    if (el('ddBtn').classList) el('ddBtn').classList.toggle('open', open);
  }

  el('logo').innerHTML = icon('#4285f4', 32, 3);
  el('g').value = param('g', 50);
  el('r').value = param('r', 1);
  el('x').value = param('x', 0);

  function num(id, fallback) {
    var v = parseFloat(el(id).value);
    return isFinite(v) ? v : fallback;
  }
  function when(ms) {
    return new Date(ms).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }
  function inText(ms, now) {
    var d = (ms - now) / XpCalc.DAY;
    if (d < 1) return 'через ' + Math.max(1, Math.round(d * 24)) + ' ч';
    return 'через ' + (Math.round(d * 10) / 10) + ' дн.';
  }
  function medals(n) { return n === 1 ? 'медаль' : n < 5 ? 'медали' : 'медалей'; }
  function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }

  function render() {
    var now = Date.now();
    var year = new Date(now).getUTCFullYear();
    el('year').textContent = 'Сервисная медаль, до 31 декабря ' + year;
    var rank = Math.min(40, Math.max(1, num('r', 1)));
    var xpIn = Math.max(0, num('x', 0));
    var o = {
      now: now,
      endMs: Date.UTC(year, 11, 31, 23, 59, 59),
      rank: rank,
      xpInRank: xpIn,
      medalLevel: medalLevel,
      xpPerGame: num('g', 0) / XpCalc.OVERLOAD_MULT, // введён XP после штрафа, внутри считаем базу
      minPerGame: MIN_PER_GAME,
      hoursPerDay: HOURS_PER_DAY,
      weeklyBonus: true,
      weekXp: Math.max(0, WEEK_XP)
    };
    var r = XpCalc.simulate(o);
    if (r.error) {
      el('summary').innerHTML = '<div class="empty">Впиши XP за игру, и я посчитаю.</div>';
      el('levels').innerHTML = '';
      return;
    }

    var done = rank >= 40 ? XpCalc.TO_RANK_40 : (rank - 1) * XpCalc.XP_PER_RANK + xpIn;
    var left = Math.max(0, XpCalc.TO_RANK_40 - done);
    var pct = Math.min(100, Math.max(0, done / XpCalc.TO_RANK_40 * 100));
    el('summary').innerHTML =
      '<div class="tiles">' +
        '<div class="tile"><div class="v">' + Math.round(r.gamesPerDay) + '</div><div class="k">игр в сутки</div></div>' +
        '<div class="tile"><div class="v">~' + fmt(r.xpPerDay) + '</div><div class="k">XP в сутки (в среднем)</div></div>' +
      '</div>' +
      '<div class="prog"><div class="top"><span>До 40 ранга</span><span><b>' + fmt(left) + '</b> XP</span></div>' +
      '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>';

    var html = '<div class="h2">Когда получишь</div>';
    if (medalLevel >= 6) {
      html += '<div class="empty">У тебя уже максимальная медаль года (красная).</div>';
    } else if (!r.results.length) {
      html += '<div class="empty">До конца ' + year + ' года при таких параметрах следующую медаль не получить.</div>';
    } else {
      r.results.forEach(function (x, i) {
        var m = MEDALS[Math.min(x.level, 6)];
        html += '<div class="item"><div class="ico" style="border-color:' + m.color + ';box-shadow:0 0 18px ' + m.color + '40">' + icon(m.color, 36, m.lvl) + '</div>' +
                '<div class="mid"><div class="nm">' + m.name + (i === 0 ? ' <span class="tag">ближайшая</span>' : '') + '</div>' +
                '<div class="dt">' + when(x.at) + '</div></div>' +
                '<div class="pill">' + inText(x.at, now) + '</div></div>';
      });
      html += '<div class="total">До конца ' + year + ' года: <b>' + r.results.length + ' ' + medals(r.results.length) + '</b></div>';
    }
    el('levels').innerHTML = html;
  }

  ['g', 'r', 'x'].forEach(function (id) {
    el(id).addEventListener('input', render);
    el(id).addEventListener('change', render);
  });

  el('ddBtn').addEventListener('click', function () { setOpen(el('ddList').hidden); });
  el('ddList').addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-lvl]') : null;
    if (!t) return;
    medalLevel = parseInt(t.getAttribute('data-lvl'), 10) || 0;
    setOpen(false);
    renderDropdown();
    render();
  });
  document.addEventListener('click', function (e) {
    if (e.target && e.target.closest && !e.target.closest('.dd')) setOpen(false);
  });

  el('note').textContent =
    'Даты примерные. Считается, что играешь без остановки, примерно раз в ' + (Math.round(MIN_PER_GAME * 10) / 10) +
    ' мин. Учтены недельный бонус (x4 и x2 в начале недели) и штраф XP Overload (x0,175 после ~11 167 XP за неделю), сброс в среду. ' +
    'XP за игру впиши такой, какой получаешь после штрафа, а бонус в начале недели я добавлю сам. Следующая медаль это снова 195 000 XP с первого ранга. Медали выдаются за календарный год.';
  renderDropdown();
  render();
})();
</script>
</body>
</html>
