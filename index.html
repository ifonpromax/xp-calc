<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<title>Калькулятор медали CS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg0: #090b0e;
    --panel: rgba(17, 20, 26, .78);
    --line: rgba(255, 255, 255, .08);
    --line2: rgba(255, 255, 255, .14);
    --fg: #f2f4f7;
    --fg2: rgba(230, 236, 245, .62);
    --fg3: rgba(230, 236, 245, .38);
    --acc: #ff9f1c;
    --acc2: #ffcb47;
    --accRGB: 255, 159, 28;
    --display: "Exo 2", "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg0); }
  body {
    margin: 0; padding: max(18px, env(safe-area-inset-top)) 16px 44px; color: var(--fg);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums; overflow-x: hidden;
  }
  .wrap { max-width: 520px; margin: 0 auto; position: relative; }

  /* фон: тактическая сетка, оранжевое зарево и лёгкие сканлайны */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
        background: radial-gradient(900px 520px at 85% -12%, rgba(var(--accRGB), .22), transparent 62%),
                    radial-gradient(700px 500px at -10% 105%, rgba(40, 110, 255, .14), transparent 60%), var(--bg0); }
  .bg::before { content: ""; position: absolute; inset: -40px;
        background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
        background-size: 40px 40px;
        -webkit-mask: radial-gradient(ellipse 80% 60% at 50% 20%, #000 20%, transparent 85%); mask: radial-gradient(ellipse 80% 60% at 50% 20%, #000 20%, transparent 85%);
        animation: drift 30s linear infinite; }
  .bg::after { content: ""; position: absolute; inset: 0; opacity: .5;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  .flare { position: absolute; width: 420px; height: 420px; right: -160px; top: -160px; border-radius: 50%;
           background: radial-gradient(circle, rgba(var(--accRGB), .35), transparent 65%); filter: blur(30px);
           animation: breathe 7s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(40px, 40px, 0); } }
  @keyframes breathe { from { opacity: .6; transform: scale(.92); } to { opacity: 1; transform: scale(1.08); } }

  /* шапка */
  .head { display: flex; align-items: center; gap: 16px; margin: 6px 2px 22px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  /* логотип: такая же HUD-панель, как карточки, с медалью в цветном свечении */
  .logo { --m: #ea4335; position: relative; isolation: isolate; width: 64px; height: 64px; flex: none; display: grid; place-items: center; border-radius: 6px;
          background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--m) 32%, transparent), transparent 70%), var(--panel);
          border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05); }
  .logo img, .logo svg { position: relative; z-index: 1; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--m) 60%, transparent)) drop-shadow(0 3px 6px rgba(0,0,0,.5)) !important; }
  .kick { display: inline-flex; align-items: center; gap: 7px; font: 700 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--acc); }
  .kick i { width: 7px; height: 7px; background: var(--acc); box-shadow: 0 0 10px var(--acc); }
  @keyframes blink { 50% { opacity: .25; } }
  h1 { margin: 6px 0 0; font: italic 900 30px/1 var(--display); letter-spacing: -.01em; text-transform: uppercase;
       background: linear-gradient(180deg, #fff 30%, #c9ced8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 6px; font-size: 13px; color: var(--fg2); }

  /* панели в стиле HUD: тонкая рамка */
  .card { position: relative; padding: 18px; margin-bottom: 14px; border-radius: 6px;
          background: var(--panel); border: 1px solid var(--line);
          -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
          box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
          animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }

  /* фон панелей: мягкие оранжевое и синее пятна медленно плавают внутри, плюс редкий диагональный блик */
  .card::after, .logo::after, .notecard::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
    background:
      linear-gradient(105deg, transparent 30%, rgba(var(--accRGB), .04) 44%, rgba(255,255,255,.045) 50%, rgba(var(--accRGB), .04) 56%, transparent 70%) 160% 0 / 260% 100% no-repeat,
      radial-gradient(closest-side, rgba(var(--accRGB), .11), transparent) 0 0 / 75% 150% no-repeat,
      radial-gradient(closest-side, rgba(60, 120, 255, .08), transparent) 100% 100% / 65% 130% no-repeat;
    animation: roam 48s cubic-bezier(.37,0,.63,1) infinite; }
  .card:nth-of-type(2)::after { animation-delay: -11s; }
  .card:nth-of-type(3)::after { animation-delay: -22s; }
  .card:nth-of-type(4)::after { animation-delay: -30s; }
  .notecard::after { animation-delay: -38s; }
  .logo::after { animation-delay: -6s; }
  /* позиции слоёв: блик, оранжевое пятно, синее пятно. Блик проходит дважды за цикл */
  @keyframes roam {
    0%     { background-position: 160% 0, -20% -30%, 120% 130%; }
    22%    { background-position: -60% 0, 50% 10%, 40% 90%; }
    49.9%  { background-position: -60% 0, 110% -20%, -10% 120%; }
    50%    { background-position: 160% 0, 110% -20%, -10% 120%; }
    72%    { background-position: -60% 0, 60% 120%, 50% -10%; }
    100%   { background-position: -60% 0, -20% -30%, 120% 130%; }
  }

  .card.top { z-index: 10; }
  .card:nth-of-type(2) { animation-delay: .07s; } .card:nth-of-type(3) { animation-delay: .14s; } .card:nth-of-type(4) { animation-delay: .21s; }

  .ch { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font: 700 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--fg2); }
  .ch b { color: var(--acc); font-weight: 700; }
  .ch::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line2), transparent); }

  .lab { display: flex; align-items: center; gap: 7px; margin: 18px 0 8px; font-size: 12.5px; font-weight: 600; letter-spacing: .02em; color: var(--fg2); }
  .ch + .lab { margin-top: 0; }
  .lab svg { color: var(--acc); opacity: .85; }
  label { font: inherit; color: inherit; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; min-width: 0; }

  .inp {
    width: 100%; padding: 13px 15px; font: 700 21px/1.2 var(--display); color: var(--fg);
    background: rgba(0,0,0,.35); border: 1px solid var(--line2); border-radius: 4px; outline: none;
    box-shadow: inset 3px 0 0 rgba(var(--accRGB), 0); -moz-appearance: textfield;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }
  .inp::-webkit-inner-spin-button, .inp::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .inp:focus { background: rgba(0,0,0,.5); border-color: rgba(var(--accRGB), .8);
               box-shadow: inset 3px 0 0 var(--acc), 0 0 0 3px rgba(var(--accRGB), .18), 0 0 24px rgba(var(--accRGB), .15); }
  .hint { margin: 8px 2px 0; font-size: 12px; color: var(--fg3); line-height: 1.4; }

  .dd { position: relative; }
  .ddbtn {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; font: 700 17px/1.2 var(--display);
    color: var(--fg); text-align: left; cursor: pointer; border-radius: 4px;
    background: linear-gradient(90deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border: 1px solid var(--line2);
    transition: border-color .18s, background .18s, transform .12s, box-shadow .18s;
  }
  .ddbtn:active { transform: scale(.99); }
  .ddbtn:focus-visible { outline: none; border-color: rgba(var(--accRGB), .8); box-shadow: 0 0 0 3px rgba(var(--accRGB), .18); }
  .ddbtn.open { border-color: rgba(var(--accRGB), .85); box-shadow: 0 0 0 3px rgba(var(--accRGB), .18), 0 0 24px rgba(var(--accRGB), .15); }
  .ddbtn .chev { margin-left: auto; color: var(--acc); transition: transform .2s; }
  .ddbtn.open .chev { transform: rotate(180deg); }

  /* меню вынесено на верхний уровень страницы */
  .ddlist {
    position: fixed; z-index: 100; padding: 6px; border-radius: 6px; overflow-y: auto; overscroll-behavior: contain;
    background: rgba(14, 16, 21, .94); border: 1px solid rgba(var(--accRGB), .35);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    box-shadow: 0 30px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.4), 0 0 30px rgba(var(--accRGB), .08);
  }
  .ddlist:not([hidden]) { animation: pop .2s cubic-bezier(.2,.9,.3,1.1) both; transform-origin: top center; }
  .dditem {
    position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; margin: 0; font: 700 16px/1.2 var(--display);
    color: var(--fg); text-align: left; cursor: pointer; background: transparent; border: 0; border-radius: 3px;
    transition: background .15s;
  }
  .dditem::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--c); opacity: 0; transition: opacity .15s; }
  .dditem + .dditem { margin-top: 2px; }
  .dditem:active { background: rgba(255,255,255,.1); }
  .dditem.sel { background: rgba(255,255,255,.07); }
  .dditem.sel::before { opacity: 1; box-shadow: 0 0 10px var(--c); }
  .dditem .ck { margin-left: auto; color: var(--acc); opacity: 0; }
  .dditem.sel .ck { opacity: 1; }

  /* статистика */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { position: relative; padding: 14px 15px 13px; border-radius: 4px; overflow: hidden;
          background: linear-gradient(160deg, rgba(var(--g), .12), rgba(255,255,255,.02) 60%); border: 1px solid var(--line); }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 2px; background: rgb(var(--g)); box-shadow: 0 0 12px rgb(var(--g)); }
  .tile .ti { position: absolute; right: 12px; top: 12px; color: rgb(var(--g)); opacity: .9; }
  .tile .v { font: 800 32px/1 var(--display); letter-spacing: -.01em; }
  .tile .k { margin-top: 6px; font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }

  .prog { margin-top: 18px; }
  .prog .top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
  .rk { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg2); }
  .rk b { display: block; margin-top: 5px; font: 800 24px/1 var(--display); letter-spacing: 0; color: var(--fg); text-transform: none; }
  .rk b small { font-size: 15px; color: var(--fg3); font-weight: 700; }
  .rk.r { text-align: right; }
  .rk.r b { color: var(--acc); }
  .bar { position: relative; height: 14px; border-radius: 2px; background: rgba(255,255,255,.06); border: 1px solid var(--line); overflow: hidden; }
  .bar > i { position: relative; display: block; height: 100%; width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1);
             background: linear-gradient(90deg, #ff6a00, var(--acc) 60%, var(--acc2)); box-shadow: 0 0 18px rgba(var(--accRGB), .6); }
  .bar > i::after { content: ""; position: absolute; inset: 0; opacity: .35;
             background: repeating-linear-gradient(-45deg, rgba(255,255,255,.5) 0 6px, transparent 6px 12px); background-size: 17px 17px;
             animation: stripes 1s linear infinite; }
  .bar::after { content: ""; position: absolute; inset: 0; pointer-events: none;
             background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 39 - 2px), rgba(9,11,14,.9) calc(100% / 39 - 2px) calc(100% / 39)); }
  @keyframes stripes { to { background-position: 17px 0; } }
  .scale { display: flex; justify-content: space-between; margin-top: 6px; font: 500 10px/1 var(--mono); color: var(--fg3); }

  /* таймлайн медалей */
  .item { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin-bottom: 10px; border-radius: 4px;
          background: linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, transparent), rgba(255,255,255,.02) 55%); border: 1px solid var(--line);
          border-left: 3px solid var(--c); }
  .item + .item::before { content: ""; position: absolute; left: 39px; top: -11px; width: 2px; height: 10px; background: var(--line2); }
  .item.first { border-color: color-mix(in srgb, var(--c) 45%, transparent); border-left-color: var(--c);
                box-shadow: 0 0 30px -8px var(--c), inset 0 0 0 1px rgba(255,255,255,.03); }
  .ico { position: relative; width: 52px; height: 52px; flex: none; display: grid; place-items: center; border-radius: 50%;
         background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%); }
  .item.first .ico::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1px dashed var(--c); opacity: .6; animation: spin 12s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mid { position: relative; flex: 1; min-width: 0; }
  .nm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 800 19px/1.15 var(--display); }
  .dt { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 13px; color: var(--fg2); }
  .dt svg { color: var(--fg3); }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 2px; font: 700 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
         color: #1a1000; background: var(--acc); box-shadow: 0 0 14px rgba(var(--accRGB), .5); }
  .tag::before { content: ""; width: 5px; height: 5px; background: #1a1000; animation: blink 1.2s steps(2) infinite; }
  .pill { position: relative; flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; border-radius: 3px; font: 700 12px/1 var(--mono);
          color: var(--fg); background: rgba(0,0,0,.35); border: 1px solid var(--line2); }
  .pill svg { color: var(--acc); }
  .empty { color: var(--fg2); font-size: 15px; }

  /* неделя: таймер до сброса и шкала бонусов x4 / x2 / x1 / штраф */
  .wk-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .mult { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 3px; font: 800 15px/1 var(--display);
          color: var(--z); background: color-mix(in srgb, var(--z) 14%, transparent); border: 1px solid color-mix(in srgb, var(--z) 40%, transparent); }
  .mult small { font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg2); }
  .reset { text-align: right; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg2); }
  .reset b { display: block; margin-top: 5px; font: 800 20px/1 var(--display); letter-spacing: 0; text-transform: none; color: var(--fg); }
  .zones { display: flex; gap: 3px; height: 10px; margin-top: 16px; }
  .zones > div { position: relative; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--z) 18%, transparent); }
  .zones > div > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--z); box-shadow: 0 0 10px var(--z); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .zlab { display: flex; gap: 3px; margin-top: 7px; font: 700 10.5px/1 var(--mono); }
  .zlab > span { color: color-mix(in srgb, var(--z) 80%, #fff); opacity: .75; }
  .wk-note { margin: 12px 0 0; font-size: 13px; color: var(--fg2); }
  .wk-note b { color: var(--fg); font-weight: 700; }

  .share { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; margin-top: 14px; padding: 13px 16px; cursor: pointer;
           font: 800 15px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: #1a1000; border: 0; border-radius: 4px;
           background: linear-gradient(90deg, #ff7a00, var(--acc) 55%, var(--acc2)); box-shadow: 0 8px 24px rgba(var(--accRGB), .3), inset 0 1px 0 rgba(255,255,255,.35);
           transition: transform .12s, box-shadow .2s, filter .2s; }
  .share:active { transform: scale(.985); }
  a.share { text-decoration: none; }

  .shot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 16px;
          background: rgba(5,6,8,.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: pop .2s ease both; }
  .shot-in { width: 100%; max-width: 420px; text-align: center; }
  .shot img { display: block; width: 100%; max-height: 68vh; object-fit: contain; border-radius: 6px; box-shadow: 0 30px 70px rgba(0,0,0,.7); }
  .shot p { margin: 12px 0 0; font-size: 13px; color: var(--fg2); }
  .shot-btns { display: flex; gap: 10px; margin-top: 12px; }
  .shot-btns .share { margin: 0; flex: 1; }
  .shot-x { flex: 1; padding: 13px 16px; cursor: pointer; font: 800 15px/1 var(--display); letter-spacing: .06em; text-transform: uppercase;
            color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line2); border-radius: 4px; }
  .share:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line2);
           font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); }
  .total b { font: 900 italic 26px/1 var(--display); letter-spacing: 0; text-transform: none; color: var(--acc); text-shadow: 0 0 18px rgba(var(--accRGB), .45); white-space: nowrap; }

  .notecard { position: relative; isolation: isolate; display: flex; gap: 11px; align-items: flex-start; padding: 13px 15px; border-radius: 4px;
              background: rgba(17,20,26,.6); border: 1px solid var(--line); border-left: 2px solid rgba(var(--accRGB), .6);
              animation: rise .55s .2s cubic-bezier(.2,.8,.2,1) both; }
  .notecard svg { flex: none; margin-top: 1px; color: var(--acc); }
  .note { margin: 0; font-size: 12px; line-height: 1.55; color: var(--fg3); }

  @media (hover: hover) {
    .card:hover { border-color: var(--line2); }
    .share:hover { filter: brightness(1.08); box-shadow: 0 10px 30px rgba(var(--accRGB), .45), inset 0 1px 0 rgba(255,255,255,.35); }
    .tile, .item, .inp, .ddbtn, .dditem { transition: box-shadow .2s, border-color .2s, background .2s, transform .15s; }
    .tile:hover { border-color: rgba(var(--g), .45); box-shadow: 0 0 24px -6px rgb(var(--g)); }
    .item:hover { transform: translateX(3px); box-shadow: 0 0 26px -8px var(--c); }
    .inp:hover:not(:focus) { border-color: rgba(var(--accRGB), .45); }
    .ddbtn:hover { border-color: rgba(var(--accRGB), .55); background: linear-gradient(90deg, rgba(var(--accRGB), .1), rgba(255,255,255,.02)); }
    .dditem:hover { background: rgba(255,255,255,.06); }
    .dditem:hover::before { opacity: .7; }
  }

  @media (max-width: 380px) {
    h1 { font-size: 25px; }
    .tile .v { font-size: 27px; }
    .nm { font-size: 17px; }
  }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
  /* при «уменьшении анимации» в системе убираем только появление карточек, фоновые эффекты оставляем */
  @media (prefers-reduced-motion: reduce) {
    .card, .head, .notecard, .ddlist { animation: none !important; }
  }
</style>
</head>
<body>
<div class="bg"><i class="flare"></i></div>
<div class="wrap">
  <header class="head">
    <div class="logo" id="logo"></div>
    <div>
      <div class="kick"><i></i>CS2 · Service Medal</div>
      <h1>Калькулятор медали</h1>
      <div class="sub" id="year"></div>
    </div>
  </header>

  <section class="card top">
    <div class="ch"><b>01</b>Параметры</div>
    <div class="lab"><i data-ic="bolt" data-s="15"></i><label for="g">XP за игру</label></div>
    <input class="inp" id="g" type="number" inputmode="decimal" step="any" min="1">
    <div class="hint">сколько XP за игру ты получаешь после штрафа (молния XP Overload на нике)</div>

    <div class="row">
      <div>
        <div class="lab"><i data-ic="flag" data-s="15"></i><label for="r">Ранг сейчас</label></div>
        <input class="inp" id="r" type="number" inputmode="numeric" min="1" max="40">
      </div>
      <div>

<script>
// Калькулятор сервисной медали CS2. Один и тот же код работает и в боте, и в мини-приложении.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.XpCalc = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const XP_PER_RANK = 5000;
  const TO_RANK_40 = 39 * XP_PER_RANK; // с 1-го до 40-го ранга: 195 000 XP
  const MIN = 60000;
  const DAY = 86400000;
  const MAX_MEDAL_LEVEL = 6;

  // Последний недельный сброс (по умолчанию среда, 00:00 UTC). Точное время у Valve может чуть отличаться.
  function lastReset(nowMs, resetDow, resetHour) {
    const dow = resetDow === undefined ? 3 : resetDow;
    const hour = resetHour === undefined ? 0 : resetHour;
    const d = new Date(nowMs);
    const back = (d.getUTCDay() - dow + 7) % 7;
    const t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), hour) - back * DAY;
    return t > nowMs ? t - 7 * DAY : t;
  }

  // Недельный множитель (по данным сообщества, у Valve точных чисел нет):
  // за неделю набрано < 4500 XP: x4 (бонус), 4500-7500: x2, 7500-11167: x1 (бонус кончился),
  // от 11167: x0,175 (XP Overload, штраф). Сброс в среду.
  const OVERLOAD_FROM = 11167;
  const OVERLOAD_MULT = 0.175;
  function bonusMultiplier(weekXp) {
    if (weekXp < 4500) return 4;
    if (weekXp < 7500) return 2;
    if (weekXp < OVERLOAD_FROM) return 1;
    return OVERLOAD_MULT;
  }

  // Сколько XP в среднем набирается за обычную неделю, начиная с понедельного сброса
  function typicalWeekXp(xpPerGame, step, weeklyBonus) {
    let weekXp = 0;
    let xp = 0;
    for (let t = 0; t < 7 * DAY; t += step) {
      const gain = xpPerGame * (weeklyBonus ? bonusMultiplier(weekXp) : 1);
      weekXp += gain;
      xp += gain;
    }
    return xp;
  }

  // o: now, endMs, rank, xpInRank, medalLevel, xpPerGame, minPerGame, hoursPerDay,
  //    weeklyBonus, weekXp, resetDow, resetHour
  function simulate(o) {
    const hoursPerDay = Math.min(24, Math.max(0.5, o.hoursPerDay || 24));
    const step = ((o.minPerGame * 24) / hoursPerDay) * MIN; // средний шаг между играми с учётом перерывов
    const resetDow = o.resetDow === undefined ? 3 : o.resetDow;
    const resetHour = o.resetHour === undefined ? 0 : o.resetHour;
    let nextReset = lastReset(o.now, resetDow, resetHour) + 7 * DAY;
    let weekXp = o.weekXp || 0;
    let toGo = Math.max(0, (40 - o.rank) * XP_PER_RANK - (o.rank >= 40 ? 0 : o.xpInRank));
    let level = o.medalLevel || 0;
    let t = o.now;
    let games = 0;
    let xp = 0;
    const results = [];

    if (!(o.xpPerGame > 0) || !(o.minPerGame > 0)) return { results, games, xp, error: 'bad input' };

    if (toGo <= 0 && level < MAX_MEDAL_LEVEL) {
      level += 1;
      results.push({ level, at: t, games, xp });
      toGo = TO_RANK_40;
    }
    while (level < MAX_MEDAL_LEVEL) {
      t += step;
      if (t > o.endMs) break;
      while (t >= nextReset) { weekXp = 0; nextReset += 7 * DAY; }
      const gain = o.xpPerGame * (o.weeklyBonus ? bonusMultiplier(weekXp) : 1);
      weekXp += gain;
      toGo -= gain;
      xp += gain;
      games += 1;
      if (toGo <= 0) {
        level += 1;
        results.push({ level, at: t, games, xp });
        toGo = TO_RANK_40; // XP сверх 40-го ранга при сбросе сгорает
      }
    }
    const gamesPerDay = (hoursPerDay * 60) / (o.minPerGame);
    const xpPerDay = typicalWeekXp(o.xpPerGame, step, o.weeklyBonus) / 7;
    return { results, games, xp, xpPerDay, gamesPerDay, levelsByEnd: level - (o.medalLevel || 0) };
  }

  return { simulate, lastReset, bonusMultiplier, OVERLOAD_FROM, OVERLOAD_MULT, XP_PER_RANK, TO_RANK_40, DAY, MIN };
});

</script>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); } catch (e) {}

  var q = new URLSearchParams(location.search);
  function param(name, fallback) {
    var v = parseFloat(q.get(name));

  }
  function el(id) { return document.getElementById(id); }

  // Когда бот сделал ссылку (t, мс). Если после этого прошёл сброс недели, набранный XP уже обнулился.
  var WEEK_FROM = param('t', Date.now());
  function weekXpNow(now) { return WEEK_FROM < XpCalc.lastReset(now) ? 0 : Math.max(0, WEEK_XP); }
  var HOURS_PER_DAY = 24;

  // Иконки (тонкие скруглённые линии). Нарисованы вручную.

    rosette: '<circle cx="12" cy="9" r="5.6"/><path d="M8.6 13.6 7 21.2l5-2.7 5 2.7-1.6-7.6"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.4V12l3.1 1.9"/>',
    chev: '<path d="M7 9.5l5 5 5-5"/>',
    check: '<path d="M5.2 12.8 9.8 17.4 18.8 7.2"/>',
    share: '<path d="M12 14.5V3.5M7.8 7.5 12 3.3l4.2 4.2"/><path d="M8 10.5H6.5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H16"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2"/><circle cx="12" cy="7.9" r=".9" fill="currentColor" stroke="none"/>'
  };
  function ico(name, size) {
    size = size || 18;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
           'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none">' + (IC[name] || '') + '</svg>';
  }

  var MEDALS = [
    { lvl: 0, name: 'Нет медали', color: null },
    { lvl: 1, name: 'Серая', color: '#c3c7cc' },
    { lvl: 2, name: 'Зелёная', color: '#34a853' },
    { lvl: 3, name: 'Синяя', color: '#4285f4' },
    { lvl: 4, name: 'Фиолетовая', color: '#a142f4' },
    { lvl: 5, name: 'Розовая', color: '#ec4899' },
    { lvl: 6, name: 'Красная', color: '#ea4335' }
  ];
  var medalLevel = Math.min(6, Math.max(0, Math.round(param('lv', 0))));

  // Картинки медалей: SteamDB хранит их по номеру предмета. 2026 год: 5270 (уровень 1) ... 5275 (уровень 6).
  // Если картинка не загрузилась, показывается нарисованная иконка.
  var MEDAL_BASE = { 2026: 5270 };
  function svgIcon(color, size) {
    if (!color) {
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24"><circle cx="12" cy="14" r="7" fill="none" ' +
             'stroke="#8e8e93" stroke-width="1.6" stroke-dasharray="3 3"/></svg>';
    }
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24">' +
      '<path d="M6.5 1.5h4l3 8h-4z" fill="' + color + '" opacity=".6"/>' +
      '<path d="M17.5 1.5h-4l-3 8h4z" fill="' + color + '" opacity=".85"/>' +
      '<circle cx="12" cy="15" r="7.5" fill="' + color + '"/>' +
      '<circle cx="12" cy="15" r="4.6" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/></svg>';
  }
  // Картинка с SteamDB (без отправки адреса сайта, чтобы обойти защиту от прямых ссылок),
  // а если она не загрузилась, нарисованная иконка.
  window.__fb = function (img, color, size) {
    img.outerHTML = svgIcon(color, size);
  };
  function medalIcon(color, size, lvl) {
    var year = new Date().getUTCFullYear();
    if (color && lvl >= 1 && MEDAL_BASE[year]) {
      var remote = 'https://www.steamdb.com/assets/images/skins/cs2/collectibles/' + year + '-service-medal--' + (MEDAL_BASE[year] + lvl - 1) + '.png';
      return '<img src="' + remote + '" referrerpolicy="no-referrer" width="' + size + '" height="' + size + '" alt="" ' +
             'style="object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))" onerror="__fb(this,\'' + color + '\',' + size + ')">';
    }
    return svgIcon(color, size);
  }

  function renderDropdown() {
    var m = MEDALS[medalLevel];
    el('ddBtn').innerHTML = medalIcon(m.color, 32, m.lvl) + '<span>' + m.name + '</span><span class="chev">' + ico('chev', 18) + '</span>';
    var html = '';
    MEDALS.forEach(function (x) {
      html += '<button type="button" class="dditem' + (x.lvl === medalLevel ? ' sel' : '') + '" data-lvl="' + x.lvl + '" style="--c:' + (x.color || '#8e8e93') + '">' +
              medalIcon(x.color, 32, x.lvl) + '<span>' + x.name + '</span><span class="ck">' + ico('check', 18) + '</span></button>';
    });
    el('ddList').innerHTML = html;
  }
  function placeList() {
    var btn = el('ddBtn'), list = el('ddList');
    if (!btn.getBoundingClientRect) return;
    var r = btn.getBoundingClientRect();
    var vh = window.innerHeight || 700;
    list.style.left = r.left + 'px';
    list.style.width = r.width + 'px';
    list.style.maxHeight = '';
    var h = list.offsetHeight;
    var below = vh - r.bottom - 14;
    var above = r.top - 14;
    if (h <= below) { list.style.top = (r.bottom + 8) + 'px'; }
    else if (h <= above) { list.style.top = (r.top - 8 - h) + 'px'; }
    else if (below >= above) { list.style.top = (r.bottom + 8) + 'px'; list.style.maxHeight = below + 'px'; }
    else { list.style.top = '14px'; list.style.maxHeight = above + 'px'; }
  }
  function setOpen(open) {
    el('ddList').hidden = !open;
    if (el('ddBtn').classList) el('ddBtn').classList.toggle('open', open);
    if (open) placeList();
  }

  // подставляем иконки в разметку
  var slots = document.querySelectorAll ? document.querySelectorAll('[data-ic]') : [];
  for (var i = 0; i < slots.length; i++) {
    slots[i].outerHTML = ico(slots[i].getAttribute('data-ic'), parseInt(slots[i].getAttribute('data-s'), 10) || 18);
  }

  el('logo').innerHTML = medalIcon('#ea4335', 44, 6);
  el('g').value = param('g', 50);
  el('r').value = param('r', 1);
  el('x').value = param('x', 0);

  function num(id, fallback) {
    var v = parseFloat(el(id).value);
    return isFinite(v) ? v : fallback;
  }
  function when(ms) {
    return new Date(ms).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }
  function inText(ms, now) {
    var d = (ms - now) / XpCalc.DAY;
    if (d < 1) return Math.max(1, Math.round(d * 24)) + ' ч';
    return (Math.round(d * 10) / 10) + ' дн.';
  }
  function medals(n) { return n === 1 ? 'медаль' : n < 5 ? 'медали' : 'медалей'; }
  function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }

  function render() {
    var now = Date.now();
    var year = new Date(now).getUTCFullYear();
    el('year').textContent = 'до 31 декабря ' + year;
    var rank = Math.min(40, Math.max(1, num('r', 1)));
    var xpIn = Math.max(0, num('x', 0));
    var o = {
      now: now,
      endMs: Date.UTC(year, 11, 31, 23, 59, 59),
      rank: rank,
      xpInRank: xpIn,
      medalLevel: medalLevel,
      xpPerGame: num('g', 0) / XpCalc.OVERLOAD_MULT, // введён XP после штрафа, внутри считаем базу
      minPerGame: MIN_PER_GAME,
      hoursPerDay: HOURS_PER_DAY,
      weeklyBonus: true,
      weekXp: weekXpNow(now)
    };
    var r = XpCalc.simulate(o);
    if (r.error) {
      el('summary').innerHTML = '<div class="ch"><b>02</b>Прогресс</div><div class="empty">Впиши XP за игру, и я посчитаю.</div>';
      el('levels').innerHTML = '';
      renderWeek();
      return;
    }

    var done = rank >= 40 ? XpCalc.TO_RANK_40 : (rank - 1) * XpCalc.XP_PER_RANK + xpIn;
    var left = Math.max(0, XpCalc.TO_RANK_40 - done);
    var pct = Math.min(100, Math.max(0, done / XpCalc.TO_RANK_40 * 100));
    el('summary').innerHTML =
      '<div class="ch"><b>02</b>Прогресс</div>' +
      '<div class="tiles">' +
        '<div class="tile" style="--g:255,159,28"><div class="ti">' + ico('gamepad', 20) + '</div><div class="v">' + Math.round(r.gamesPerDay) + '</div><div class="k">игр в сутки</div></div>' +
        '<div class="tile" style="--g:255,214,10"><div class="ti">' + ico('bolt', 20) + '</div><div class="v">~' + fmt(r.xpPerDay) + '</div><div class="k">XP в сутки</div></div>' +
      '</div>' +
      '<div class="prog"><div class="top">' +
        '<div class="rk">Ранг<b>' + Math.floor(rank) + '<small> / 40</small></b></div>' +
        '<div class="rk r">До 40 ранга<b>' + fmt(left) + ' XP</b></div></div>' +
      '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="scale"><span>1</span><span>10</span><span>20</span><span>30</span><span>40</span></div></div>';

    var html = '<div class="ch"><b>04</b>Когда получишь</div>';
    if (medalLevel >= 6) {
      html += '<div class="empty">У тебя уже максимальная медаль года (красная).</div>';
    } else if (!r.results.length) {
      html += '<div class="empty">До конца ' + year + ' года при таких параметрах следующую медаль не получить.</div>';
    } else {
      r.results.forEach(function (x, i) {
        var m = MEDALS[Math.min(x.level, 6)];
        html += '<div class="item' + (i === 0 ? ' first' : '') + '" style="--c:' + m.color + '">' +
                '<div class="ico">' + medalIcon(m.color, 44, m.lvl) + '</div>' +
                '<div class="mid"><div class="nm">' + m.name + (i === 0 ? ' <span class="tag">next</span>' : '') + '</div>' +
                '<div class="dt">' + ico('calendar', 14) + '<span>' + when(x.at) + '</span></div></div>' +
                '<div class="pill">' + ico('clock', 13) + inText(x.at, now) + '</div></div>';
      });
      html += '<div class="total"><span>До конца ' + year + ' года</span><b>' + r.results.length + ' ' + medals(r.results.length) + '</b></div>';
      shareData = { results: r.results, now: now, year: year, rank: Math.floor(rank), xpPerDay: r.xpPerDay,
        query: [Math.floor(rank), Math.floor(xpIn), num('g', 0), medalLevel, MIN_PER_GAME].join(' ') };
      html += '<button type="button" class="share" id="share">' + ico('share', 18) + 'Поделиться</button>';
    }
    el('levels').innerHTML = html;

  }

  // ---------- Неделя: сброс бонуса и сколько XP уже набрано ----------
  var ZONES = [
    { from: 0, to: 4500, mult: 'x4', color: '#30d158' },
    { from: 4500, to: 7500, mult: 'x2', color: '#ffcb47' },
    { from: 7500, to: XpCalc.OVERLOAD_FROM, mult: 'x1', color: '#7aa7ff' },
    { from: XpCalc.OVERLOAD_FROM, to: XpCalc.OVERLOAD_FROM + 2500, mult: 'x0,175', color: '#ea4335' }
  ];
  function zoneOf(xp) {
    for (var i = 0; i < ZONES.length - 1; i++) if (xp < ZONES[i].to) return ZONES[i];
    return ZONES[ZONES.length - 1];
  }
  function leftText(ms) {
    var m = Math.max(0, Math.floor(ms / 60000));
    var d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;

  }
  function renderWeek() {
    var now = Date.now();
    var reset = XpCalc.lastReset(now) + 7 * XpCalc.DAY;
    var w = weekXpNow(now);
    var z = zoneOf(w);
    var html = '<div class="ch"><b>03</b>Неделя</div><div class="wk-top">';
    html += HAS_WEEK
      ? '<div class="mult" style="--z:' + z.color + '">' + z.mult + '<small>' + (z.mult === 'x0,175' ? 'штраф' : z.mult === 'x1' ? 'без бонуса' : 'бонус') + '</small></div>'
      : '<div class="mult" style="--z:#30d158">x4<small>в начале недели</small></div>';
    html += '<div class="reset">Сброс через<b>' + leftText(reset - now) + '</b></div></div>';

    html += '<div class="zones">';
    ZONES.forEach(function (x) {
      var fill = HAS_WEEK ? Math.min(1, Math.max(0, (w - x.from) / (x.to - x.from))) : 0;
      html += '<div style="flex:' + (x.to - x.from) + ';--z:' + x.color + '"><i style="width:' + (fill * 100).toFixed(1) + '%"></i></div>';
    });
    html += '</div><div class="zlab">';
    ZONES.forEach(function (x) { html += '<span style="flex:' + (x.to - x.from) + ';--z:' + x.color + '">' + x.mult + '</span>'; });
    html += '</div>';

    var note;
    if (!HAS_WEEK) note = 'Первые <b>4 500 XP</b> недели идут с бонусом x4, потом x2, после ~<b>' + fmt(XpCalc.OVERLOAD_FROM) + ' XP</b> включается штраф.';
    else if (z.mult === 'x0,175') note = 'За неделю <b>' + fmt(w) + ' XP</b>. Штраф до сброса, дальше XP идёт медленно.';
    else note = 'За неделю <b>' + fmt(w) + ' XP</b>. До ' + (z.mult === 'x1' ? 'штрафа' : 'конца ' + z.mult) + ' осталось <b>' + fmt(z.to - w) + ' XP</b>.';
    html += '<p class="wk-note">' + note + '</p>';
    el('week').innerHTML = html;
  }

  // ---------- Картинка для «Поделиться» ----------
  // Рисуем карточку 1080x1350 на canvas. Картинки SteamDB рисовать нельзя (без CORS холст «портится»),
  // поэтому на картинке свои медали «в стиле Paint» из папки paint/, а если их нет, простая нарисованная медаль.
  var shareData = null;
  function loadImg(src) {
    return new Promise(function (ok) {
      var im = new Image();
      im.onload = function () { ok(im); };
      im.onerror = function () { ok(null); };
      im.src = src;
    });
  }
  function medalImg(lvl) {
    var m = MEDALS[lvl];
    return loadImg('paint/' + lvl + '.png').then(function (im) {
      if (im) return im;
      var svg = svgIcon(m.color, 240).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
      return loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
    });
  }
  function rgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function spaced(ctx, px) { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; }

  function drawCard(d) {
    var W = 1080, H = 1350, P = 72;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false; // медали нарисованы «пикселями», при увеличении не размываем
    var next = d.results[0];
    var nm = MEDALS[Math.min(next.level, 6)];
    var fonts = ['italic 900 120px "Exo 2"', '800 72px "Exo 2"', '700 28px "JetBrains Mono"', '500 28px "JetBrains Mono"'];
    var levels = d.results.map(function (x) { return Math.min(x.level, 6); });

    return Promise.all([
      document.fonts ? Promise.all(fonts.map(function (f) { return document.fonts.load(f, 'АБВ123'); })) : null,
      Promise.all(levels.map(medalImg))
    ]).then(function (res) {
      var imgs = res[1];

      // фон: тёмный, сетка, оранжевое и синее зарево, зарево цвета медали за ней
      ctx.fillStyle = '#090b0e'; ctx.fillRect(0, 0, W, H);
      var g = ctx.createRadialGradient(W * .9, -80, 0, W * .9, -80, 800);
      g.addColorStop(0, 'rgba(255,159,28,.30)'); g.addColorStop(1, 'rgba(255,159,28,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      g = ctx.createRadialGradient(-100, H + 100, 0, -100, H + 100, 800);
      g.addColorStop(0, 'rgba(60,120,255,.20)'); g.addColorStop(1, 'rgba(60,120,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1;
      for (var x = 0; x <= W; x += 54) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
      for (var y = 0; y <= H; y += 54) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }

      // шапка
      ctx.fillStyle = '#ff9f1c'; ctx.shadowColor = '#ff9f1c'; ctx.shadowBlur = 16;
      ctx.fillRect(P, P + 2, 18, 18); ctx.shadowBlur = 0;
      ctx.font = fonts[2]; spaced(ctx, 5); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.fillText('CS2 · SERVICE MEDAL ' + d.year, P + 36, P + 12);

      // главная медаль
      var cx = W / 2, cy = 440;
      g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 340);
      g.addColorStop(0, rgba(nm.color, .55)); g.addColorStop(1, rgba(nm.color, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 100, W, 760);
      ctx.strokeStyle = rgba(nm.color, .35); ctx.lineWidth = 2; ctx.setLineDash([10, 12]);
      ctx.beginPath(); ctx.arc(cx, cy, 240, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      if (imgs[0]) {
        ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
        ctx.drawImage(imgs[0], cx - 190, cy - 190, 380, 380);
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      }

      ctx.textAlign = 'center';
      ctx.font = fonts[3]; spaced(ctx, 6); ctx.fillStyle = 'rgba(230,236,245,.6)';
      ctx.fillText('СЛЕДУЮЩАЯ МЕДАЛЬ', cx, 740);
      ctx.font = fonts[0]; spaced(ctx, 0); ctx.fillStyle = nm.color;
      ctx.shadowColor = rgba(nm.color, .6); ctx.shadowBlur = 40;
      ctx.fillText(nm.name.toUpperCase(), cx, 830); ctx.shadowBlur = 0;
      ctx.font = fonts[1]; ctx.fillStyle = '#f2f4f7';
      ctx.fillText(new Date(next.at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }), cx, 930);
      ctx.font = fonts[3]; spaced(ctx, 3); ctx.fillStyle = '#ff9f1c';
      ctx.fillText('ЧЕРЕЗ ' + inText(next.at, d.now).toUpperCase(), cx, 990);

      // все медали до конца года
      var by = 1050;
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(P, by); ctx.lineTo(W - P, by); ctx.stroke(); ctx.setLineDash([]);
      ctx.textAlign = 'left'; ctx.font = fonts[3]; spaced(ctx, 3); ctx.fillStyle = 'rgba(230,236,245,.55)';
      ctx.fillText('ДО КОНЦА ' + d.year, P, by + 58);
      ctx.textAlign = 'right'; ctx.font = 'italic 900 52px "Exo 2"'; spaced(ctx, 0); ctx.fillStyle = '#ff9f1c';
      ctx.shadowColor = 'rgba(255,159,28,.5)'; ctx.shadowBlur = 24;
      ctx.fillText(d.results.length + ' ' + medals(d.results.length).toUpperCase(), W - P, by + 58); ctx.shadowBlur = 0;

      var n = d.results.length, slot = (W - P * 2) / n, s = Math.min(96, slot - 20);
      d.results.forEach(function (r, i) {
        var mx = P + slot * i + slot / 2;
        if (imgs[i]) ctx.drawImage(imgs[i], mx - s / 2, by + 95, s, s);
        ctx.textAlign = 'center'; ctx.font = '700 26px "JetBrains Mono"'; spaced(ctx, 1); ctx.fillStyle = '#f2f4f7';
        ctx.fillText(new Date(r.at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }), mx, by + 95 + s + 34);
      });

      // рамка
      ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
      ctx.strokeRect(24, 24, W - 48, H - 48);
      return new Promise(function (ok) { cv.toBlob(ok, 'image/png'); });
    });
  }

  // Окно с готовой картинкой: на случай, когда системное «Поделиться» недоступно (Telegram на Android и ПК)
  function showCard(blob) {
    var url = URL.createObjectURL(blob);
    var box = document.createElement('div');
    box.className = 'shot';
    box.innerHTML = '<div class="shot-in"><img src="' + url + '" alt="Карточка медали">' +
      '<p>Зажми картинку, чтобы сохранить или переслать</p>' +
      '<div class="shot-btns"><a class="share" href="' + url + '" download="cs2-medal.png">Скачать</a>' +
      '<button type="button" class="shot-x">Закрыть</button></div></div>';
    box.addEventListener('click', function (e) {
      if (e.target === box || e.target.closest('.shot-x')) { box.remove(); URL.revokeObjectURL(url); }
    });
    document.body.appendChild(box);
  }

  var sharing = false;
  el('levels').addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('#share');
    if (!btn || !shareData || sharing) return;
    // В Телеграме: выбор чата, бот сам рисует картинку и отдаёт её как фото (инлайн-режим бота)
    if (tg && tg.initData && tg.switchInlineQuery && tg.isVersionAtLeast && tg.isVersionAtLeast('6.7')) {
      try {
        try { tg.HapticFeedback.impactOccurred('light'); } catch (err) {}
        tg.switchInlineQuery(shareData.query, ['users', 'groups', 'channels']);
        return;
      } catch (err) { /* инлайн у бота выключен: рисуем картинку здесь */ }
    }
    sharing = true;
    btn.style.opacity = '.6';
    try { tg.HapticFeedback.impactOccurred('light'); } catch (err) {}
    drawCard(shareData).then(function (blob) {
      var file = new File([blob], 'cs2-medal.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file] }).catch(function (err) {
          if (!err || err.name !== 'AbortError') showCard(blob);
        });
      }
      showCard(blob);
    }).catch(function () {}).then(function () { sharing = false; btn.style.opacity = ''; });
  });
  setInterval(renderWeek, 30000);

  ['g', 'r', 'x'].forEach(function (id) {
    el(id).addEventListener('input', render);
    el(id).addEventListener('change', render);
  });

  el('ddBtn').addEventListener('click', function () { setOpen(el('ddList').hidden); });
  el('ddList').addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-lvl]') : null;
    if (!t) return;
    medalLevel = parseInt(t.getAttribute('data-lvl'), 10) || 0;
    setOpen(false);
    renderDropdown();
    render();
  });
  document.addEventListener('click', function (e) {
    if (e.target && e.target.closest && !e.target.closest('.dd') && !e.target.closest('#ddList')) setOpen(false);
  });
  if (window.addEventListener) {
    window.addEventListener('scroll', function () { if (!el('ddList').hidden) setOpen(false); }, { passive: true });
    window.addEventListener('resize', function () { if (!el('ddList').hidden) setOpen(false); });
  }

  el('note').textContent =
    'Даты примерные. Считается, что играешь без остановки, примерно раз в ' + (Math.round(MIN_PER_GAME * 10) / 10) +
    ' мин. Учтены недельный бонус (x4 и x2 в начале недели) и штраф XP Overload (x0,175 после ~11 167 XP за неделю), сброс в среду. ' +
    'XP за игру впиши такой, какой получаешь после штрафа, а бонус в начале недели я добавлю сам. ' +
    'Следующая медаль это снова 195 000 XP с первого ранга. Медали выдаются за календарный год.';
  renderDropdown();
  render();
})();
</script>
